[tool.black]
line-length = 110
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "N",
  "PIE",
  "D20",
  "BLE",
  "FBT",
  "B",
  "COM818",
  "C4",
  "T100",
  "FA102",
  "ISC",
  "ICN",
  "LOG",
  "G",
]
ignore = [
  "D203",
  
  "D205",
]
exclude = [
    ".git",
    ".mypy_cache",
    ".tox",
    ".venv",
    "build",
    "dist"
]